model: glm-5.1
label:
  en_US: glm-5.1
  zh_Hans: glm-5.1
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
- name: thinking_mode
  type: string
  required: true
  default: 关闭
  options:
  - 关闭
  - 开启
  label:
    en_US: Thinking mode
    zh_Hans: 思考模式
  help:
    en_US: Disabled by default. Select 开启 to enable thinking or 关闭 to disable it.
    zh_Hans: 默认关闭；选择开启后启用深度思考。
