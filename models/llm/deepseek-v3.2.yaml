model: deepseek-v3.2
label:
  en_US: deepseek-v3.2
  zh_Hans: deepseek-v3.2
model_type: llm
features:
- agent-thought
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
