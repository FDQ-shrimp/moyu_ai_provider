model: gemini-2.5-pro
label:
  en_US: gemini-2.5-pro
  zh_Hans: gemini-2.5-pro
model_type: llm
features:
- vision
- document
- video
- agent-thought
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
