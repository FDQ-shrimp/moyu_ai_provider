model: glm-5.3
label:
  en_US: glm-5.3
  zh_Hans: glm-5.3
model_type: llm
features:
- agent-thought
- tool-call
- stream-tool-call
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
