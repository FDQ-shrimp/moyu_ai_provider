model: deepseek-v4-pro
label:
  en_US: deepseek-v4-pro
  zh_Hans: deepseek-v4-pro
model_type: llm
features:
- agent-thought
- tool-call
- stream-tool-call
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
- name: thinking_mode
  type: string
  required: true
  default: 开启
  options:
  - 关闭
  - 开启
  label:
    en_US: Thinking mode
    zh_Hans: 思考模式
  help:
    en_US: The upstream default is enabled.
    zh_Hans: 上游默认开启。
