model: FLUX.2-dev
label:
  en_US: FLUX.2-dev
  zh_Hans: FLUX.2-dev
model_type: llm
features:
- agent-thought
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
