provider: moyu
label:
  en_US: Moyu AI
  zh_Hans: 魔芋AI
description:
  en_US: Access Moyu AI hosted LLM models.
  zh_Hans: 通过魔芋AI接入多种大语言模型。
icon_small:
  en_US: icon.png
  zh_Hans: icon.png
icon_large:
  en_US: icon.png
  zh_Hans: icon.png
background: "#5B6CFF"
help:
  title:
    en_US: Get your Moyu AI API Key
    zh_Hans: 获取魔芋AI API Key
  url:
    en_US: https://www.moyu.info/
    zh_Hans: https://www.moyu.info/
supported_model_types:
  - llm
  - text-embedding
  - rerank
configurate_methods:
  - predefined-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      required: true
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      placeholder:
        en_US: Enter your Moyu AI API Key
        zh_Hans: 请输入魔芋AI API Key
      help:
        en_US: API key generated in Moyu AI console.
        zh_Hans: 在魔芋AI控制台生成的 API Key。
models:
  llm:
    predefined:
      - "models/llm/*.yaml"
  text_embedding:
    predefined:
      - "models/text_embedding/*.yaml"
  rerank:
    predefined:
      - "models/rerank/*.yaml"
extra:
  python:
    provider_source: provider/moyu.py
    model_sources:
      - "models/llm/llm.py"
      - "models/text_embedding/text_embedding.py"
      - "models/rerank/rerank.py"
