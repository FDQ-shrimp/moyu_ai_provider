provider: moyu
label:
  en_US: Moyu AI
  zh_Hans: 魔芋AI
description:
  en_US: Verified models for Moyu AI China and Konjac AI overseas sites. Models labeled China only require the China site.
  zh_Hans: 提供国内、海外双站实测模型；标注“仅国内站”的模型必须选择国内站。
icon_small:
  en_US: icon.png
  zh_Hans: icon.png
icon_large:
  en_US: icon.png
  zh_Hans: icon.png
background: "#5B6CFF"
help:
  title:
    en_US: Get your Moyu AI API Key
    zh_Hans: 获取魔芋AI API Key
  url:
    en_US: https://www.moyu.cn/
    zh_Hans: https://www.moyu.cn/
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - predefined-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      required: true
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      placeholder:
        en_US: Enter your Moyu AI API Key
        zh_Hans: 请输入魔芋AI API Key
      help:
        en_US: API key generated in Moyu AI console.
        zh_Hans: 在魔芋AI控制台生成的 API Key。
    - variable: endpoint_url
      required: false
      default: https://www.moyu.cn/v1
      label:
        en_US: API Key Site
        zh_Hans: API Key 所属站点
      type: select
      options:
        - value: https://www.moyu.cn/v1
          label:
            en_US: China Site
            zh_Hans: 国内站
        - value: https://www.konjac.ai/v1
          label:
            en_US: Overseas Site
            zh_Hans: 海外站
      help:
        en_US: Select the site that issued this API Key. Models labeled China only require the China site.
        zh_Hans: 请选择签发此 API Key 的站点；标注“仅国内站”的模型无法在海外站使用。
